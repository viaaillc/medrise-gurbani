{"name": "Deploy MedRise Gurbani site", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "read", "pages": "write", "id-token": "write"}, "concurrency": {"group": "pages", "cancel-in-progress": true}, "jobs": {"deploy": {"runs-on": "ubuntu-latest", "environment": {"name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}"}, "steps": [{"uses": "actions/checkout@v4"}, {"name": "Unpack site", "run": "set -e; rm -rf unpacked site; mkdir unpacked site; for z in *.zip; do unzip -oq \"$z\" -d unpacked; done; if [ -d docs ]; then cp -r docs/. site/; else cp -r unpacked/*/docs/. site/; fi; ls site"}, {"uses": "actions/upload-pages-artifact@v3", "with": {"path": "site"}}, {"id": "deployment", "uses": "actions/deploy-pages@v4"}]}}}
